  - paragraph [ref=e225]: "What moved the needle, in order: unboxed scalars and a raw native ABI, record/tuple reuse with borrowed field access, killing an mmap-per-allocation scratch allocator, a borrowed parameter ABI, capacity-tracked in-place string append, per-clause last-use moves, self-recursive borrowing (a greatest-fixpoint inference that lets recursion pass references without counting), inline field storage for small records, and a flat record ABI that keeps scalar records in registers — each verified against the full corpus under the leak gate before it landed. As of the flat record ABI every row is a win on CPU and on memory; the honest caveats moved elsewhere — integers are i64 rather than bignums, and multi-constructor or non-scalar records still allocate."
