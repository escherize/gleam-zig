          - text: ", a nullary constructor carrying no payload at all. A full binary tree has more leaves than internal nodes, so the majority allocation was a 120-byte heap record representing nothing. Nullary constructors are constants, so each variant now gets one immortal shared value instead. Peak memory fell from 2.0 GB to 1.03 GB, exactly the predicted half."
        - paragraph [ref=e621]:
          - strong [ref=e622]: "What this row cost to get right:"
          - text: the figure published here (1.07 s) stopped reproducing, and chasing that found a real regression. The runtime’s two environment gates, the leak check and the pooling switch, were each scanning the whole process environment per call, and both sit on the allocation path. At 16.8 million records this benchmark spent over a billion string comparisons deciding, repeatedly, that nothing had changed. Resolving each gate once took depth 21 from 42.5 s to 0.70 s. The ray tracer, which had drifted the same way, returned to 0.08 s with byte-identical output.
        - paragraph [ref=e623]:
          - strong [ref=e624]: "Still open:"
          - text: "memory. 1.03 GB against node’s 885 MB and the BEAM’s 834 MB is the one number on this page where zig loses outright, and it is structural: a live depth-21 tree is 4.2 million"
          - code [ref=e625]: Node
          - text: "records at 120 bytes each. The 56-byte header is the target, a comptime name-hash tag, labels folded into the tag word, or pooling by arity, but this row is also the standing reminder to measure first: the last guess about where record cost sat was wrong by 2×."
